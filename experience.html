<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina Experience</title>

<style>

.lumina-opening{
  width:100%;
  max-width:380px;
  text-align:center;
}

/* Prevent normal moment animation from revealing
   the opening content too early. */
.moment.lumina-opening{
  opacity:1;
  transform:none;
  animation:none;
}

.lumina-opening-label{
  margin-bottom:42px;

  color:#cda85d;
  font-size:13px;
  letter-spacing:.24em;
  text-transform:uppercase;

  opacity:0;
  transform:translateY(7px);

  animation:
    luminaOpeningReveal
    1.2s
    ease
    .8s
    forwards;
}

.lumina-opening-lines{
  display:grid;
  gap:14px;
}

.lumina-opening-line{
  margin:0 auto;
  max-width:350px;

  font-size:27px;
  line-height:1.5;
  color:#f3ead8;

  opacity:0;
  transform:translateY(14px);

  animation-name:luminaOpeningReveal;
  animation-duration:1.25s;
  animation-timing-function:ease;
  animation-fill-mode:forwards;

  animation-delay:
    calc(
      2.2s +
      (var(--line-index) * 1.35s)
    );
}

@media (max-width:380px){
  .lumina-opening{
    max-width:330px;
  }

  .lumina-opening-label{
    margin-bottom:36px;
    font-size:12px;
  }

  .lumina-opening-line{
    font-size:24px;
    line-height:1.5;
  }
}

@keyframes luminaOpeningReveal{
  from{
    opacity:0;
    transform:translateY(12px);
    filter:blur(2px);
  }

  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}  

.lumina-welcome{
  width:100%;
  max-width:360px;
  text-align:center;
}

.moment.lumina-welcome{
  opacity:1;
  transform:none;
  animation:none;
}

.lumina-welcome-label{
  color:#cda85d;
  font-size:14px;
  line-height:1.6;
  letter-spacing:.08em;
  margin-bottom:34px;

  opacity:0;
  transform:translateY(8px);

  animation:
    luminaWelcomeReveal
    1.1s
    ease
    .9s
    forwards;
}

.lumina-welcome-lines{
  display:grid;
  gap:18px;
}

.lumina-welcome-line{
  margin:0;
  max-width:none;
  font-size:27px;
  line-height:1.5;
  color:#f3ead8;

  opacity:0;
  transform:translateY(12px);

  animation-name:luminaWelcomeReveal;
  animation-duration:1s;
  animation-timing-function:ease;
  animation-fill-mode:forwards;

  animation-delay:
    calc(
      2.2s +
      (var(--line-index) * 1.2s)
    );
}

@keyframes luminaWelcomeReveal{
  from{
    opacity:0;
    transform:translateY(12px);
    filter:blur(2px);
  }

  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}

/* ---------- Scene 3: Formal Invitation ---------- */

.formal-invitation{
  width:100%;
  max-width:370px;
  text-align:center;
}

.moment.formal-invitation{
  opacity:1;
  transform:none;
  animation:none;
}

.formal-basmala{
  color:#d9bd79;
  font-size:20px;
  line-height:1.8;
  margin-bottom:18px;
}

.formal-label{
  color:#cda85d;
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  margin-bottom:18px;
}

.formal-introduction{
  max-width:340px;
  margin:0 auto 18px;
  color:#d8c7a5;
  font-size:15px;
  line-height:1.7;
}

.formal-hosts{
  color:#f3ead8;
  font-size:16px;
  line-height:1.55;
  margin-bottom:22px;
}

.formal-couple{
  margin:20px 0 24px;
}

.formal-name{
  color:#fff5df;
  font-size:27px;
  line-height:1.25;
}

.formal-ampersand{
  color:#cda85d;
  font-size:18px;
  margin:8px 0;
}

.formal-details{
  display:grid;
  gap:7px;
  color:#d8c7a5;
  font-size:15px;
  line-height:1.55;
}

.formal-rsvp{
  margin-top:18px;
  color:#cda85d;
  font-size:13px;
  letter-spacing:.08em;
}

@media (max-width:380px){
  .formal-basmala{
    font-size:18px;
  }

  .formal-introduction{
    font-size:14px;
  }

  .formal-name{
    font-size:24px;
  }

  .formal-details{
    font-size:14px;
  }

}

  /* ---------- Wedding Finale ---------- */

.wedding-finale{
  width:100%;
  max-width:360px;
  text-align:center;
}

.moment.wedding-finale{
  opacity:1;
  transform:none;
  animation:none;
}

/* ---------- Wedding Finale ---------- */

.wedding-finale{
  width:100%;
  max-width:360px;
  text-align:center;
}

.moment.wedding-finale{
  opacity:1;
  transform:none;
  animation:none;
}

.wedding-finale .label{
  margin-bottom:26px;
}

.wedding-finale-couple{
  margin:0 0 30px;
}

.wedding-finale-name{
  color:#fff5df;
  font-size:34px;
  line-height:1.18;
}

.wedding-finale-ampersand{
  color:#cda85d;
  font-size:18px;
  margin:10px 0;
}

.wedding-finale-date{
  color:#f3ead8;
  font-size:21px;
  line-height:1.5;
  margin-bottom:18px;
}

.wedding-finale-venue{
  color:#d8c7a5;
  font-size:16px;
  line-height:1.6;
  max-width:300px;
  margin:0 auto 30px;
}

.wedding-finale-countdown{
  max-width:310px;
  margin:0 auto 30px;
  padding:20px 16px;
  border-top:1px solid rgba(205,168,93,.28);
  border-bottom:1px solid rgba(205,168,93,.28);
}

.wedding-finale-countdown-label{
  color:#cda85d;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:10px;
}

.wedding-finale-countdown-value{
  color:#f3ead8;
  font-size:18px;
  line-height:1.5;
}

.wedding-finale-closing{
  color:#d8c7a5;
  font-size:17px;
  line-height:1.65;
  font-style:italic;
  max-width:300px;
  margin:0 auto;
}

.wedding-finale-hashtag{
  color:#cda85d;
  font-size:13px;
  letter-spacing:.08em;
  margin-top:22px;
}

@media (max-width:380px){
  .wedding-finale-name{
    font-size:29px;
  }

  .wedding-finale-date{
    font-size:19px;
  }

  .wedding-finale-venue{
    font-size:15px;
  }

  .wedding-finale-countdown-value{
    font-size:17px;
  }

  .wedding-finale-closing{
    font-size:16px;
  }
}


/* ---------- Scene 3 Reveal ---------- */

.formal-part{
  opacity:0;
  transform:translateY(10px);
  animation:
    formalReveal
    .9s
    ease
    forwards;
}

.formal-part-1{animation-delay:.5s;}
.formal-part-2{animation-delay:1.3s;}
.formal-part-3{animation-delay:2.1s;}
.formal-part-4{animation-delay:3.0s;}
.formal-part-5{animation-delay:4.0s;}
.formal-part-6{animation-delay:5.2s;}
.formal-part-7{animation-delay:6.2s;}

@keyframes formalReveal{
  from{
    opacity:0;
    transform:translateY(10px);
    filter:blur(1.5px);
  }

  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}
  
*{box-sizing:border-box;margin:0;padding:0}

body{
min-height:100vh;
background:#080604;
color:#f3ead8;
font-family:Georgia,serif;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

#stage{
width:100%;
max-width:430px;
height:100dvh;
position:relative;
overflow:hidden;
background:
radial-gradient(circle at top,rgba(205,168,93,.22),transparent 36%),
linear-gradient(180deg,#080604,#151006 55%,#080604);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:34px 28px;
}

.moment{
opacity:0;
transform:translateY(28px);
animation:momentIn 1.4s ease forwards;
}

.label{
color:#cda85d;
font-size:12px;
letter-spacing:.22em;
text-transform:uppercase;
margin-bottom:24px;
}

h1{
font-size:36px;
line-height:1.15;
margin-bottom:24px;
}

p{
font-size:20px;
line-height:1.65;
color:#d8c7a5;
max-width:340px;
}

@keyframes momentIn{
to{
opacity:1;
transform:translateY(0);
}
}
.fade-out{
opacity:.08;
transition:opacity .7s ease;
}

.fade-in{
opacity:1;
transition:opacity .9s ease;
}

.photo-moment{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
padding:34px;
}

.photo-frame{
width:82%;
max-width:330px;
height:58vh;
border-radius:24px;
overflow:hidden;
box-shadow:0 0 55px rgba(205,168,93,.24);
opacity:0;
transform:scale(.82);
animation:
photoArrive
calc(var(--photo-duration, 10000ms) * .24)
ease
forwards;
}

.photo-frame img{
width:100%;
height:100%;
object-fit:cover;
transform:scale(1);
animation:
photoDrift
var(--photo-duration, 10000ms)
ease-in-out
forwards;
}

@keyframes photoArrive{
0%{
opacity:0;
transform:scale(.78);
filter:brightness(.45) blur(3px);
}
60%{
opacity:1;
filter:brightness(.85) blur(0);
}
100%{
opacity:1;
transform:scale(.92);
filter:brightness(1);
}
}

@keyframes photoDrift{
0%,20%{
transform:scale(1);
}
85%{
transform:scale(1.12);
}
100%{
transform:scale(1.12);
}
}

.photo-romantic .photo-frame{
box-shadow:
0 0 70px rgba(205,168,93,.28),
0 18px 55px rgba(0,0,0,.45);
}

.photo-warm .photo-frame{
filter:sepia(.08) saturate(.94);
}

.photo-bright .photo-frame{
filter:brightness(1.06) saturate(1.06);
}

.photo-elegant .photo-frame{
border:1px solid rgba(205,168,93,.48);
}

.photo-classic .photo-frame{
border-radius:14px;
}

.photo-nostalgic .photo-frame{
filter:sepia(.16) contrast(.94);
}

.photo-soft .photo-frame{
box-shadow:
0 0 80px rgba(243,234,216,.16),
0 18px 55px rgba(0,0,0,.38);
}

.photo-hopeful .photo-frame{
filter:brightness(1.04);
}
  
</style>
</head>

<body>

<div id="stage"></div>

</html>
